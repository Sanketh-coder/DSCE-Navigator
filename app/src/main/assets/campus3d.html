<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
    <title>DSCE Navigator 3D</title>
    <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    <style>
        html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; }
        #map { position: absolute; inset: 0; }
        .tools {
          position: absolute; right: 12px; top: 140px; z-index: 2;
          display: flex; flex-direction: column; gap: 10px;
        }
        .tools button {
          width: 52px; height: 52px; border: 0; border-radius: 26px;
          background: linear-gradient(135deg, #4338CA, #7C3AED);
          color: #fff; font-size: 15px; font-weight: bold;
          box-shadow: 0 6px 16px rgba(67,56,202,.45);
          transition: transform .15s ease;
        }
        .tools button:active { transform: scale(.88); }
    </style>
</head>
<body>
<div id="map"></div>
<div class="tools">
    <button id="viewBtn">2D</button>
    <button id="locateBtn">&#9678;</button>
</div>

<script>
    // 3D map approach adapted from a friend's example (MapLibre GL JS + OpenFreeMap).
    // The Android app calls the functions below: setPlaces, setBuildings, selectPoint,
    // clearSelection, setUser, setRoute, clearRoute, fitRoute and moveCamera.
    var places = { type: "FeatureCollection", features: [] };      // places without a building number
    var buildings = { type: "FeatureCollection", features: [] };   // numbered buildings (key map)
    var userData = { type: "FeatureCollection", features: [] };
    var routeData = { type: "Feature", properties: {}, geometry: { type: "LineString", coordinates: [] } };
    var selectedData = { type: "FeatureCollection", features: [] };
    var ready = false;
    var lastUser = null;
    var is3d = true;
    var pendingSelect = null;
    var pendingFit = false;

    function setPlaces(list) {
      places.features = list.map(function (p) {
        return {
          type: "Feature",
          properties: { name: p.name },
          geometry: { type: "Point", coordinates: [p.lon, p.lat] }
        };
      });
      if (ready) { map.getSource("places").setData(places); }
    }

    function setBuildings(list) {
      buildings.features = list.map(function (b) {
        return {
          type: "Feature",
          properties: { no: String(b.no), name: b.name },
          geometry: { type: "Point", coordinates: [b.lon, b.lat] }
        };
      });
      if (ready) { map.getSource("buildings").setData(buildings); }
    }

    // Highlights a point and shows a label above it (for example the department name)
    function selectPoint(lat, lon, label, fly) {
      if (!ready) { pendingSelect = { lat: lat, lon: lon, label: label, fly: fly }; return; }
      selectedData.features = [{
        type: "Feature",
        properties: { label: label },
        geometry: { type: "Point", coordinates: [lon, lat] }
      }];
      map.getSource("selected").setData(selectedData);
      if (fly) {
        map.flyTo({ center: [lon, lat], zoom: Math.max(map.getZoom(), 17.5), duration: 1200 });
      }
    }

    function clearSelection() {
      pendingSelect = null;
      if (!ready) { return; }
      selectedData.features = [];
      map.getSource("selected").setData(selectedData);
      clearRoute();
    }

    function setUser(lat, lon, bearing) {
      lastUser = { lat: lat, lon: lon, bearing: bearing };
      userData.features = [{
        type: "Feature",
        properties: { bearing: bearing },
        geometry: { type: "Point", coordinates: [lon, lat] }
      }];
      if (ready) { map.getSource("user").setData(userData); }
    }

    function setRoute(coords) {
      routeData.geometry.coordinates = coords;
      if (ready) { map.getSource("route").setData(routeData); }
    }

    function clearRoute() { setRoute([]); }

    function fitRoute() {
      if (!ready) { pendingFit = true; return; }
      var c = routeData.geometry.coordinates;
      if (c.length < 2) { return; }
      var b = new maplibregl.LngLatBounds(c[0], c[0]);
      c.forEach(function (p) { b.extend(p); });
      map.fitBounds(b, {
        padding: { top: 140, bottom: 260, left: 40, right: 40 },
        maxZoom: 19, duration: 1000
      });
    }

    function moveCamera(lat, lon, bearing, pitch, zoom) {
      if (!ready) { return; }
      map.easeTo({
        center: [lon, lat],
        bearing: bearing,
        pitch: is3d ? pitch : 0,
        zoom: zoom > 0 ? zoom : map.getZoom(),
        offset: [0, 140],
        duration: 900
      });
    }

    var map = new maplibregl.Map({
      container: "map",
      style: "https://tiles.openfreemap.org/styles/liberty",
      center: [77.5667, 12.9083],
      zoom: 16.6,
      pitch: 60,
      bearing: -20,
      maxPitch: 85
    });

    function arrowImage() {
      var c = document.createElement("canvas");
      c.width = 64; c.height = 64;
      var g = c.getContext("2d");
      g.fillStyle = "#ffffff";
      g.beginPath(); g.arc(32, 32, 26, 0, Math.PI * 2); g.fill();
      g.fillStyle = "#4338CA";
      g.beginPath();
      g.moveTo(32, 10); g.lineTo(46, 44); g.lineTo(32, 37); g.lineTo(18, 44);
      g.closePath(); g.fill();
      return g.getImageData(0, 0, 64, 64);
    }

    map.on("load", function () {
      if (map.getLayer("building-3d")) { map.removeLayer("building-3d"); }
      var firstLabel = map.getStyle().layers.find(function (l) { return l.type === "symbol"; });

      map.addLayer({
        id: "my-3d-buildings",
        source: "openmaptiles",
        "source-layer": "building",
        type: "fill-extrusion",
        minzoom: 14,
        paint: {
          "fill-extrusion-height": ["coalesce", ["get", "render_height"], 8],
          "fill-extrusion-base": ["coalesce", ["get", "render_min_height"], 0],
          "fill-extrusion-color": [
            "interpolate", ["linear"], ["coalesce", ["get", "render_height"], 8],
            0, "#dfe3e8", 15, "#c4ccd6", 40, "#9fb0c4", 80, "#6f88a8"
          ],
          "fill-extrusion-opacity": 0.95,
          "fill-extrusion-vertical-gradient": true
        }
      }, firstLabel ? firstLabel.id : undefined);

      map.addImage("user-arrow", arrowImage());

      // Route
      map.addSource("route", { type: "geojson", data: routeData });
      map.addLayer({
        id: "route-casing", type: "line", source: "route",
        layout: { "line-cap": "round", "line-join": "round" },
        paint: { "line-color": "#ffffff", "line-width": 11 }
      });
      map.addLayer({
        id: "route-line", type: "line", source: "route",
        layout: { "line-cap": "round", "line-join": "round" },
        paint: { "line-color": "#7C3AED", "line-width": 7 }
      });

      // Glow around the selected place
      map.addSource("selected", { type: "geojson", data: selectedData });
      map.addLayer({
        id: "selected-halo", type: "circle", source: "selected",
        paint: {
          "circle-radius": 19,
          "circle-color": "rgba(124,58,237,0.30)",
          "circle-stroke-color": "#7C3AED",
          "circle-stroke-width": 2
        }
      });

      // Numbered buildings from the key map
      map.addSource("buildings", { type: "geojson", data: buildings });
      map.addLayer({
        id: "building-bubble", type: "circle", source: "buildings",
        paint: {
          "circle-radius": ["interpolate", ["linear"], ["zoom"], 15, 6, 17, 9, 19, 12],
          "circle-color": "#4338CA",
          "circle-stroke-color": "#ffffff",
          "circle-stroke-width": 1.8
        }
      });
      map.addLayer({
        id: "building-number", type: "symbol", source: "buildings",
        minzoom: 16.2,
        layout: {
          "text-field": ["get", "no"],
          "text-font": ["Noto Sans Bold"],
          "text-size": ["interpolate", ["linear"], ["zoom"], 16, 7, 17, 9, 19, 12],
          "text-allow-overlap": true,
          "text-ignore-placement": true
        },
        paint: { "text-color": "#ffffff" }
      });

      // Other places (gates, ground, temple...) that have no building number
      map.addSource("places", { type: "geojson", data: places });
      map.addLayer({
        id: "place-dots", type: "circle", source: "places",
        paint: {
          "circle-radius": 6,
          "circle-color": "#F97316",
          "circle-stroke-color": "#ffffff",
          "circle-stroke-width": 2
        }
      });
      map.addLayer({
        id: "place-names", type: "symbol", source: "places",
        minzoom: 17.4,
        layout: {
          "text-field": ["get", "name"],
          "text-font": ["Noto Sans Bold"],
          "text-size": 11,
          "text-anchor": "top",
          "text-offset": [0, 0.9],
          "text-max-width": 8
        },
        paint: {
          "text-color": "#9a3412",
          "text-halo-color": "#ffffff",
          "text-halo-width": 2
        }
      });

      // Department / place name above the selected building
      map.addLayer({
        id: "selected-label", type: "symbol", source: "selected",
        layout: {
          "text-field": ["get", "label"],
          "text-font": ["Noto Sans Bold"],
          "text-size": 14,
          "text-anchor": "bottom",
          "text-offset": [0, -1.7],
          "text-max-width": 12,
          "text-allow-overlap": true
        },
        paint: {
          "text-color": "#3730A3",
          "text-halo-color": "#ffffff",
          "text-halo-width": 2.5
        }
      });

      // You
      map.addSource("user", { type: "geojson", data: userData });
      map.addLayer({
        id: "user-arrow", type: "symbol", source: "user",
        layout: {
          "icon-image": "user-arrow",
          "icon-size": 0.7,
          "icon-rotate": ["get", "bearing"],
          "icon-rotation-alignment": "map",
          "icon-allow-overlap": true,
          "icon-ignore-placement": true
        }
      });

      ready = true;
      if (pendingSelect) {
        selectPoint(pendingSelect.lat, pendingSelect.lon, pendingSelect.label, pendingSelect.fly);
        pendingSelect = null;
      }
      if (pendingFit) { pendingFit = false; fitRoute(); }
    });

    // Tapping a numbered building or a place tells the app through the Android bridge
    map.on("click", function (e) {
      var pad = 20;
      var box = [[e.point.x - pad, e.point.y - pad], [e.point.x + pad, e.point.y + pad]];
      var hits = map.queryRenderedFeatures(box, { layers: ["building-bubble", "place-dots"] });
      if (hits.length > 0 && window.Android) {
        var props = hits[0].properties;
        if (props.no) { Android.onBuildingTapped(props.no); }
        else { Android.onPlaceTapped(props.name); }
      }
    });

    map.on("dragstart", function () {
      if (window.Android) { Android.onUserMoved(); }
    });

    // Long press: tells the app the latitude / longitude (handy for adding new buildings)
    var pressTimer = null;
    var lastReport = 0;
    function reportPress(lngLat) {
      var now = Date.now();
      if (now - lastReport < 1500) { return; }
      lastReport = now;
      if (window.Android) { Android.onMapLongPress(lngLat.lat, lngLat.lng); }
    }
    function cancelPress() { if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; } }
    map.on("touchstart", function (e) {
      cancelPress();
      if (e.originalEvent.touches && e.originalEvent.touches.length !== 1) { return; }
      var ll = e.lngLat;
      pressTimer = setTimeout(function () { reportPress(ll); }, 800);
    });
    map.on("touchmove", cancelPress);
    map.on("touchend", cancelPress);
    map.on("dragstart", cancelPress);
    map.on("zoomstart", cancelPress);
    map.on("contextmenu", function (e) { reportPress(e.lngLat); });

    document.getElementById("viewBtn").onclick = function () {
      is3d = !is3d;
      map.easeTo({ pitch: is3d ? 60 : 0, bearing: is3d ? map.getBearing() : 0, duration: 800 });
      this.textContent = is3d ? "2D" : "3D";
    };

    document.getElementById("locateBtn").onclick = function () {
      if (window.Android) { Android.onRecenter(); }
      if (lastUser) {
        map.easeTo({ center: [lastUser.lon, lastUser.lat], zoom: 18, duration: 800 });
      }
    };
</script>
</body>
</html>
